<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Appliance Solutions 901</title>

  <!-- Zona privada: fuera de los buscadores -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#12212a">

  <link rel="icon" href="../images/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ICONOS -->
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs>
    <symbol id="a-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>
    </symbol>
    <symbol id="a-whatsapp" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.98-.14.16-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.48c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.87 2.35.99 2.51c.12.16 1.71 2.61 4.15 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.12-.22-.19-.47-.31z"/>
    </symbol>
    <symbol id="a-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>
    </symbol>
    <symbol id="a-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M9 6V4h6v2M6.5 6l1 14h9l1-14"/>
    </symbol>
    <symbol id="a-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>
    </symbol>
    <symbol id="a-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M4.6 5.2 3 13v6h18v-6l-1.6-7.8a2 2 0 0 0-2-1.6H6.6a2 2 0 0 0-2 1.6z"/>
    </symbol>
  </defs></svg>

  <!-- ================= LOGIN ================= -->
  <div class="login" id="loginView">
    <form class="login__card" id="loginForm" novalidate>
      <img class="login__logo" src="../images/logo-dark.png" width="720" height="164"
           alt="Appliance Solutions 901">
      <h1>Panel de solicitudes</h1>
      <p class="login__sub">Entra para ver y organizar lo que llega del sitio.</p>

      <label for="user">Usuario</label>
      <input id="user" type="text" autocomplete="username" placeholder="yeanochoa" required>

      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" required>

      <p class="login__error" id="loginError" role="alert" hidden></p>

      <button class="btn btn--red" type="submit" id="loginBtn">Entrar</button>
    </form>
  </div>

  <!-- ================= PANEL ================= -->
  <div class="app" id="appView" hidden>

    <header class="topbar">
      <img class="topbar__logo" src="../images/logo-dark.png" width="720" height="164"
           alt="Appliance Solutions 901">
      <div class="topbar__right">
        <span class="topbar__user" id="topbarUser"></span>
        <button class="btn btn--ghost" type="button" id="logoutBtn">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><use href="#a-logout"></use></svg>
          Salir
        </button>
      </div>
    </header>

    <main class="wrap">
      <!-- CONTADORES -->
      <section class="stats" aria-label="Resumen">
        <article class="stat stat--new">
          <p class="stat__num" id="statNuevas">0</p>
          <p class="stat__label">Nuevas sin atender</p>
        </article>
        <article class="stat">
          <p class="stat__num" id="statSemana">0</p>
          <p class="stat__label">Entraron esta semana</p>
        </article>
        <article class="stat">
          <p class="stat__num" id="statAgendadas">0</p>
          <p class="stat__label">Agendadas</p>
        </article>
        <article class="stat">
          <p class="stat__num" id="statTerminadas">0</p>
          <p class="stat__label">Terminadas</p>
        </article>
      </section>

      <!-- FILTROS -->
      <section class="tools">
        <div class="tabs" id="tabs" role="tablist" aria-label="Filtrar por estado">
          <button class="tab is-active" type="button" data-estado="todas" role="tab" aria-selected="true">Todas</button>
          <button class="tab" type="button" data-estado="nueva" role="tab" aria-selected="false">Nuevas</button>
          <button class="tab" type="button" data-estado="contactada" role="tab" aria-selected="false">Contactadas</button>
          <button class="tab" type="button" data-estado="agendada" role="tab" aria-selected="false">Agendadas</button>
          <button class="tab" type="button" data-estado="terminada" role="tab" aria-selected="false">Terminadas</button>
          <button class="tab" type="button" data-estado="perdida" role="tab" aria-selected="false">Perdidas</button>
        </div>
        <input class="search" id="search" type="search" placeholder="Buscar por nombre, teléfono o electrodoméstico">
      </section>

      <p class="banner" id="banner" role="alert" hidden></p>

      <!-- LISTA -->
      <section class="leads" id="leads" aria-live="polite"></section>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><use href="#a-inbox"></use></svg>
        <p id="emptyText">Todavía no hay solicitudes.</p>
      </div>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
